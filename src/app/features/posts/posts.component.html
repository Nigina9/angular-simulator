<div class="container user-posts">
  <h2>Посты пользователей</h2>
  <a routerLink="/posts/create" id="link-create" class="button">Создать новый пост</a>
  <div class="card">
    @if (loading) {
      @for (row of skeletonRows; track $index) {
        <p-skeleton height="2rem"></p-skeleton>
      }
    } @else {
      <p-contextmenu #menu [model]="items"/>
      <p-table
        [value]="posts"
        [paginator]="true"
        [lazy]="true"
        [rows]="rows"
        [first]="first"
        [totalRecords]="totalRecords"
        [rowsPerPageOptions]="[10,20,50]"
        (onPage)="onPageChange($event)"
        [contextMenu]="menu"
        [(contextMenuSelection)]="selectedPost"
      >
        <ng-template #header>
          <tr>
            <th class="text">Title</th>
            <th class="text">Tags</th>
            <th class="text">Views</th>
          </tr>
        </ng-template>
        <ng-template #body let-post>
          <tr (dblclick)="onTableDLClick(post)" class="table-row" [pContextMenuRow]="post" >
            <td>{{ post.title }}</td>
            <td>{{ post.tags }}</td>
            <td>{{ post.views }}</td>
          </tr>
        </ng-template>
      </p-table>
    }
  </div>
</div>

<router-outlet></router-outlet>
