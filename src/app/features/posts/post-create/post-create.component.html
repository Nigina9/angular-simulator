<div class="container create-page">
  <h2 class="create-form-title">Создайте новый пост !</h2>
  <form class="create-form" [formGroup]="createForm" id="create-post">
    <div class="create-form__item">
      <label class="name-label" for="title-input">Title:</label>
      <input type="text" formControlName="title" placeholder="заголовок" class="input-field" id="title-input" />
    </div>

    <div class="create-form__item">
      <label class="name-label" for="body-input">Body</label>
      <input type="text" formControlName="body" placeholder="текст" class="input-field" id="body-input" />
    </div>

    <div class="create-form__item">
      <label class="name-label" for="tags">Tags:</label>
      <input type="text" formControlName="tags" placeholder="добавьте теги" class="input-field" id="tags" />
    </div>

    <div class="create-form__item" formGroupName="reactions">
      <div class="name-label">Reactions:</div>

      <div class="input-container">
        <label for="likes">Likes:</label>
        <input
          id="likes"
          type="number"
          min="0"
          formControlName="likes"
          placeholder="количество лайков"
          class="input-field"
        />

        <label for="dislikes">Dislikes:</label>
        <input
          id="dislikes"
          type="number"
          min="0"
          formControlName="dislikes"
          placeholder="количество дизлайков"
          class="input-field"
        />
      </div>
    </div>

    <div class="create-form__item">
      <label class="name-label" for="views">Views:</label>
      <input
        type="number"
        min="0"
        formControlName="views"
        placeholder="количество просмотров"
        class="input-field"
        id="views"
      />
    </div>

    <div class="create-form__item">
      <label class="name-label" for="user-id">User ID:</label>
      <input
        type="number"
        min="0"
        formControlName="userId"
        placeholder="номер ID пользователя"
        class="input-field"
        id="user-id"
      />
    </div>

    <button type="submit" class="button" (click)="onSavePost()" id="save-post">Отправить</button>
  </form>
</div>
